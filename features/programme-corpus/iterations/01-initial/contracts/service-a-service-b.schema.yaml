# <a>-<b>.schema.yaml — machine-readable wire schema for the A↔B contract.
# Sits beside <a>-<b>.contract.md (the prose agreement); this file is the
# DIFFABLE truth for shapes. Record real payloads (captured, not assumed), then
# formalize here. Additive-only on existing surfaces (compat checklist in the
# contract file must pass).
contract: a-b                    # matches the contract file's id
version: 1                       # bump ONLY on a breaking change (new /v2 path)
transport: rest                  # rest | sse | websocket | redis-stream | internal-http

endpoints:
  - method: POST
    path: /api/...
    request:
      # field: type  # required|optional — one line per field
      example_field: string      # required
    response:
      example_field: string      # required
    errors:
      - code: 400
        meaning: ""

# For streaming boundaries: the event vocabulary + per-event payload shape.
events: []
#  - name: token
#    payload:
#      text: string
